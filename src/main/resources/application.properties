spring.application.name=bairro-em-foco

# --- Banco de dados (SQLite via JDBC) ---
# Caminho relativo à pasta de onde a aplicação é iniciada (raiz do projeto).
# O SQLite cria o arquivo .db, mas a pasta data/ precisa existir.
spring.datasource.url=jdbc:sqlite:./data/bairro-em-foco.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite aceita apenas uma escrita por vez: uma única conexão evita "database is locked".
spring.datasource.hikari.maximum-pool-size=1
# Chaves estrangeiras vêm desligadas no SQLite; o PRAGMA vale por conexão,
# então é executado sempre que o Hikari abre uma nova conexão.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# --- Inicialização do banco ---
# Executa schema.sql e data.sql a cada inicialização (ambos são idempotentes).
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
