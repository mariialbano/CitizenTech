# Banco separado para os testes, dentro de target/ (descartável, apagado no "mvnw clean").
spring.datasource.url=jdbc:sqlite:./target/bairro-em-foco-test.db

# Recria as tabelas a cada execução dos testes, para que sempre validem o schema.sql atual.
# reset-test.sql existe apenas em src/test e nunca é usado pelo banco de desenvolvimento.
spring.sql.init.schema-locations=classpath:reset-test.sql,classpath:schema.sql
